<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liên kết ion – Học liệu tương tác</title>
<style>
:root{--ink:#14213d;--mut:#475569;--bg:#eef3fb;--pri:#1d4ed8;--ok:#15803d;--okb:#dcfce7;--wnb:#fef3c7;--inf:#e0ecff;--line:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{color:var(--pri)}#steps{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--mut)}
.dot.on{background:var(--pri);color:#fff;border-color:var(--pri)}.dot.dn{background:var(--okb);border-color:var(--ok);color:var(--ok)}.dot:disabled{opacity:.4;cursor:not-allowed}
main{max-width:980px;margin:16px auto;padding:0 14px 90px}
.card{background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 2px 10px #1e3a8a1a;margin-bottom:16px}
h1{font-size:2.4rem;margin:.2em 0;color:var(--pri)}h2{margin:0 0 6px;font-size:1.45rem;color:var(--pri)}
.task{background:var(--inf);border-left:6px solid var(--pri);padding:10px 14px;border-radius:8px;margin:10px 0;font-weight:600}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:2px solid var(--pri);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.g{background:#fff;color:var(--pri)}.btn.on{background:var(--pri);color:#fff}.btn:disabled{background:#94a3b8;border-color:#94a3b8;color:#fff;cursor:not-allowed}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f0f6ff}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:#fee2e2;border-color:#b91c1c;color:#7f1d1d;text-decoration:line-through}.opt.pk{background:var(--inf);border-color:var(--pri)}
.fb:empty{display:none}.fb{border-radius:10px;padding:10px 14px;margin-top:8px}
.fb.ok{background:var(--okb);color:#14532d}.fb.warn{background:var(--wnb);color:#78350f}.fb.info{background:var(--inf)}
.qt{font-weight:700;margin:14px 0 4px}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
svg{max-width:100%;height:auto}
.ring{fill:none;stroke:#64748b;stroke-width:1.5}.ring.sel{stroke:#f59e0b;stroke-width:4}
.e{fill:#fbbf24;stroke:#78350f;stroke-width:1.5;transition:transform 1s ease-in-out}
.spin{animation:sp linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
table{border-collapse:collapse;margin:8px 0}td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
select,input[type=number]{font:inherit;padding:5px 8px;border:2px solid var(--line);border-radius:8px}
.chip,.pi{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;margin:4px;color:#fff;user-select:none}
.chip{cursor:grab;font-size:1.1rem}.pi{cursor:pointer}.pos{background:#1d4ed8}.neg{background:#c2410c}
.zone{min-height:70px;border:3px dashed #94a3b8;border-radius:12px;padding:6px;margin:8px 0;background:#f8fafc}.ph{color:var(--mut)}
.chk{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.chk span{padding:4px 12px;border-radius:8px;border:2px solid var(--line);font-weight:700}.chk span.f{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.at{text-align:center;min-width:110px}.nuc{display:inline-block;width:56px;height:56px;line-height:56px;border-radius:50%;color:#fff;font-weight:700;font-size:1.1rem}
.dots{font-size:1.5rem;color:#d97706;letter-spacing:2px;min-height:34px}.lb{font-weight:700}
.concl{background:#fff7ed;border:2px solid #fb923c;border-radius:10px;padding:10px 14px;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);padding:10px;display:flex;justify-content:center;gap:12px}
canvas{touch-action:none;width:100%;max-width:520px;background:#f8fafc;border-radius:12px;border:2px solid var(--line);cursor:grab}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.hero>*{flex:1;min-width:280px}
</style></head><body>
<header><b>Liên kết ion</b><div id="steps"></div></header>
<main id="app"></main>
<nav><button class="btn g" id="bk" onclick="go(cur-1)">← Quay lại</button><button class="btn" id="nx" onclick="go(cur+1)">Tiếp →</button></nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const SUB='₀₁₂₃₄₅₆₇₈₉',sub=n=>n>1?SUB[n]:'';
const SUP={1:'⁺',2:'²⁺',3:'³⁺','-1':'⁻','-2':'²⁻','-3':'³⁻',0:''},ionS=(s,c)=>s+SUP[c];
const chg=c=>c>0?'+'+c:c<0?'−'+(-c):'0';
const EL={Na:{z:11,sh:[2,8,1],c:'#2563eb'},Mg:{z:12,sh:[2,8,2],c:'#7c3aed'},Cl:{z:17,sh:[2,8,7],c:'#15803d'},O:{z:8,sh:[2,6],c:'#dc2626'}};
const ION={Na:{c:1},Mg:{c:2},Al:{c:3},Ca:{c:2},Cl:{c:-1},O:{c:-2},F:{c:-1}};
const fill=n=>{const s=[];for(const c of[2,8,8]){const t=Math.min(n,c);if(t>0)s.push(t);n-=t}return s};
const gcd=(a,b)=>b?gcd(b,a%b):a;
let cur=0,maxR=1,done={0:true},st={},M={},T={};
const NM=['Giới thiệu','Khởi động','Electron','Chuyển e','Ion','Liên kết','Tinh thể','MgCl₂/MgO','Luyện tập','Đánh giá'];

function atom(cx,cy,sym,sh,o={}){let g='';
 sh.forEach((n,i)=>{const r=26+i*24,L=i==sh.length-1&&o.ang;let es='';
  for(let k=0;k<n;k++){const a=(L?o.ang[k]:-90+i*22+k*360/n)*Math.PI/180;
   es+=`<circle class="e" id="${o.id||'e'}${i}_${k}" cx="${(cx+r*Math.cos(a)).toFixed(1)}" cy="${(cy+r*Math.sin(a)).toFixed(1)}" r="6"${o.click?` style="cursor:pointer" onclick="${o.click}(${i},${k})"`:''}/>`}
  g+=`<g class="${o.spin?'spin':''}" style="${o.spin?`animation-duration:${8+i*5}s;transform-origin:${cx}px ${cy}px`:''}"><circle class="ring" id="${o.id||'r'}r${i}" cx="${cx}" cy="${cy}" r="${r}"/>${o.ringclick?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="transparent" stroke-width="16" style="pointer-events:stroke;cursor:pointer" onclick="ring(${i})"/>`:''}${es}</g>`});
 const lab=o.lab||sym;
 return g+`<circle cx="${cx}" cy="${cy}" r="18" fill="${EL[sym]?EL[sym].c:'#475569'}"/><text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#fff" font-weight="700" font-size="${lab.length>2?11:14}">${lab}</text>`}

function mcq(id,q,opts,ans,hints,exp,cb,once){const ix=opts.map((_,i)=>i).sort(()=>Math.random()-.5);M[id]={ix,ans,hints,exp,cb,w:0,once};
 return `<div class="q" id="q_${id}"><div class="qt">${q}</div><div class="opts">${ix.map((o,p)=>`<button class="opt" onclick="pick('${id}',${p})">${opts[o]}</button>`).join('')}</div><div class="fb" id="fb_${id}"></div></div>`}
function pick(id,p){const m=M[id];if(m.d)return;const bs=$$('#q_'+id+' .opt'),f=$('#fb_'+id),right=m.ix[p]==m.ans;
 const end=()=>{m.d=1;bs.forEach((b,i)=>{b.disabled=true;if(m.ix[i]==m.ans)b.classList.add('ok')});m.cb&&m.cb(m.w==0&&right)};
 if(right){end();f.className='fb ok';f.innerHTML='✅ Chính xác! '+m.exp}
 else if(m.once){m.w++;bs[p].classList.add('bad');end();f.className='fb warn';f.innerHTML='❌ Chưa đúng. '+m.exp}
 else{m.w++;bs[p].classList.add('bad');bs[p].disabled=true;
  if(m.w>=3){end();f.className='fb warn';f.innerHTML='Đáp án đúng đã được đánh dấu. '+m.exp}
  else{f.className='fb warn';f.innerHTML='🤔 Chưa đúng, thử lại nhé. Gợi ý: '+m.hints[Math.min(m.w-1,m.hints.length-1)]}}}
function fb(id,cls,h){const f=$('#'+id);f.className='fb '+cls;f.innerHTML=h}
function concl(id,h){$('#'+id).innerHTML=`<div class="concl">💡 <b>Kết luận:</b> ${h}</div>`}

function fin(i){done[i]=true;maxR=Math.max(maxR,i+1);nav()}
function go(n){if(n<0||n>9)return;cur=n;st={};M={};render()}
function nav(){$('#bk').disabled=cur==0;$('#nx').disabled=!done[cur]||cur==9;$('#nx').style.visibility=cur==9?'hidden':'visible';
 $('#steps').innerHTML=NM.map((n,i)=>`<button class="dot ${i==cur?'on':done[i]?'dn':''}" title="${n}" ${i>maxR?'disabled':''} onclick="go(${i})">${i+1}</button>`).join('')}
function render(){const s=SC[cur];$('#app').innerHTML=s.h();s.i&&s.i();nav();scrollTo(0,0)}
const head=(t,task)=>`<h2>${t}</h2><div class="task">${task}</div>`;

/* ---------- Màn 1: giới thiệu ---------- */
const s0=()=>`<div class="card hero"><div><p style="color:var(--mut);margin:0">Hóa học 10 · Liên kết hóa học</p><h1>LIÊN KẾT ION</h1><p>Natri là kim loại bốc cháy khi gặp nước. Clo là khí độc. Vậy mà chúng hợp lại thành muối ăn. Điều gì đã xảy ra ở cấp độ nguyên tử? Hãy tự mình thao tác và khám phá.</p><button class="btn" style="font-size:1.2rem;padding:12px 24px" onclick="go(1)">Bắt đầu khám phá →</button></div>
<svg viewBox="0 0 440 200">${atom(110,100,'Na',[2,8,1],{spin:1})}${atom(330,100,'Cl',[2,8,7],{spin:1})}</svg></div>`;

/* ---------- Màn 2: khởi động ---------- */
const PR=['Hai nguyên tử góp chung electron','Nguyên tử Na nhường electron cho nguyên tử Cl','Nguyên tử Cl nhường electron cho nguyên tử Na','Không có electron nào chuyển, hai nguyên tử chỉ hút nhau'];
const s1=()=>`<div class="card">${head('Khởi động','Tình huống: Na cháy trong khí Cl₂ tạo ra muối ăn NaCl màu trắng. Hãy dự đoán: ở cấp độ nguyên tử, Na và Cl đã làm gì với nhau?')}
<div class="opts">${PR.map((p,k)=>`<button class="opt" onclick="pred(${k})">${p}</button>`).join('')}</div><div class="fb" id="fp"></div></div>`;
function pred(k){st.pred=k;window.PRED=k;$$('.opt').forEach((b,i)=>{b.disabled=true;if(i==k)b.classList.add('pk')});
 fb('fp','info','📝 Dự đoán của em đã được ghi lại. Ở đây chưa chấm đúng/sai: hãy kiểm chứng bằng mô phỏng ở các màn sau, rồi đối chiếu lại nhé.');fin(1)}

/* ---------- Màn 3: electron ---------- */
const s2=()=>`<div class="card">${head('Khám phá electron','Nhiệm vụ: chọn từng nguyên tố, chạm vào mỗi lớp electron để đếm, rồi điền số electron ở lớp ngoài cùng vào bảng.')}
<div class="row" style="align-items:flex-start"><div><div>${Object.keys(EL).map(k=>`<button class="btn g" id="b3${k}" onclick="sel3('${k}')">${k}</button>`).join(' ')}</div><svg id="sv3" viewBox="0 0 200 200" width="280"></svg></div>
<div style="flex:1;min-width:260px"><div class="fb info" id="inf3">Chọn một nguyên tố, rồi chạm vào từng vòng (lớp) electron.</div>
<table><tr><th>Nguyên tố</th><th>Số e lớp ngoài cùng</th><th></th></tr>${Object.keys(EL).map(k=>`<tr><td><b>${k}</b> (Z = ${EL[k].z})</td><td><select id="s3${k}"><option value="">?</option>${[1,2,3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join('')}</select></td><td id="m3${k}"></td></tr>`).join('')}</table>
<button class="btn" onclick="chk3()">Kiểm tra bảng</button><div class="fb" id="fb3"></div></div></div>
${mcq('m3','Dự đoán: để lớp ngoài cùng đạt 8 electron bền vững, nguyên tử Na (Z = 11) dễ làm điều nào nhất?',['Nhường 1 electron','Nhận 7 electron','Nhận 1 electron','Nhường 7 electron'],0,['Hãy chọn cách phải thay đổi ÍT electron nhất.','Nếu Na mất hết electron lớp ngoài cùng thì lớp nào trở thành lớp ngoài cùng, và nó có bao nhiêu electron?'],'Na nhường 1 electron thì lớp ngoài cùng là lớp thứ 2 với 8 electron (2,8).',()=>{st.m3=1;d3()})}
<div id="c3"></div></div>`;
function sel3(k){st.k3=k;$('#sv3').innerHTML=atom(100,100,k,EL[k].sh,{ringclick:1});$$('[id^=b3]').forEach(b=>b.classList.remove('on'));$('#b3'+k).classList.add('on');fb('inf3','info','Chạm vào từng vòng electron để đếm.')}
function ring(i){$$('.ring').forEach(r=>r.classList.remove('sel'));$('#rr'+i).classList.add('sel');const sh=EL[st.k3].sh;
 fb('inf3','info',`Lớp ${i+1}: <b>${sh[i]}</b> electron${i==sh.length-1?' (lớp xa hạt nhân nhất, lớp ngoài cùng)':''}`)}
function chk3(){st.a=st.a||{};let all=1;Object.keys(EL).forEach(k=>{const v=$('#s3'+k).value,c=EL[k].sh.at(-1),m=$('#m3'+k);if(+v==c&&v){m.innerHTML='✅';return}
 all=0;st.a[k]=(st.a[k]||0)+1;m.innerHTML=!v?'⚠️ Chưa chọn':st.a[k]<2?`🤔 Hãy đếm lại electron ở lớp xa hạt nhân nhất của ${k}.`:`💡 ${k} có ${EL[k].z} electron: lớp 1 chứa 2, lớp 2 chứa tối đa 8, phần còn lại nằm ở lớp ngoài.`});
 if(all){fb('fb3','ok','✅ Chính xác!');st.t3=1;concl('c3','electron ở lớp ngoài cùng của nguyên tử nhóm A gọi là <b>electron hóa trị</b>; chúng quyết định nguyên tử nhường hay nhận electron.');d3()}else fb('fb3','warn','Còn dòng chưa đúng, xem gợi ý bên phải.')}
function d3(){if(st.t3&&st.m3)fin(2)}

/* ---------- Màn 4: chuyển electron ---------- */
const s3=()=>`<div class="card">${head('Chuyển electron: Na + Cl','Nhiệm vụ: nhấp vào electron mà em dự đoán sẽ chuyển đi. Quan sát điều gì xảy ra với hai nguyên tử.')}
<svg id="sv4" viewBox="0 0 640 260" width="100%"></svg><div class="fb info" id="fb4">Nhấp vào một electron bất kì.</div><div id="af4"></div>
<button class="btn g" style="margin-top:10px" onclick="go(3)">↺ Làm lại</button></div>`;
function i3(){$('#sv4').innerHTML=atom(150,125,'Na',[2,8,1],{id:'n',ang:[0],click:'trN'})+atom(490,125,'Cl',[2,8,7],{id:'c',ang:[0,45,90,135,225,270,315],click:'trC'})+
 `<circle id="slot" cx="416" cy="125" r="6" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3"/><text x="150" y="245" text-anchor="middle" font-weight="700">Nguyên tử Na</text><text x="490" y="245" text-anchor="middle" font-weight="700">Nguyên tử Cl</text>`}
function trN(i,k){if(st.t4)return;
 if(i<2){fb('fb4','warn','🤔 Electron này ở gần hạt nhân nên bị giữ rất chặt. Hãy thử electron khác.');return}
 st.t4=1;$('#n2_0').style.transform='translate(192px,0)';fb('fb4','info','Electron đang chuyển từ Na sang Cl...');
 setTimeout(()=>{$('#slot').style.fill='#fbbf24';$('#slot').style.stroke='#78350f';$('#slot').style.strokeDasharray='none';$('#nr2').style.strokeDasharray='4 4';$('#nr2').style.opacity='.35';
  $('#sv4').insertAdjacentHTML('beforeend','<text x="320" y="122" text-anchor="middle" font-size="30">⇄</text><text x="320" y="150" text-anchor="middle" font-size="15" font-weight="700">hút nhau</text>');
  const p=window.PRED,msg=p==1?'Dự đoán của em ở màn 2 là <b>đúng</b>!':'Kết quả khác dự đoán của em ở màn 2: Na <b>nhường</b> electron, Cl <b>nhận</b> electron.';
  fb('fb4','ok','✅ Electron đã chuyển từ Na sang Cl. '+msg);
  $('#af4').innerHTML=`<div class="row" style="margin:10px 0"><div class="fb info" style="flex:1">Na: 11 proton · electron <b>11 → 10</b></div><div class="fb info" style="flex:1">Cl: 17 proton · electron <b>17 → 18</b></div></div>`+
  mcq('m4','Quan sát: sau khi chuyển, lớp ngoài cùng của hai hạt Na và Cl lần lượt có bao nhiêu electron?',['1 và 7','8 và 8','0 và 8','2 và 8'],1,['Na còn 10 electron: lớp 1 có 2, phần còn lại ở lớp 2. Lớp 3 còn electron không?','Cl có 18 electron: 2 + 8 + ...?'],'Na còn cấu hình 2,8 và Cl thành 2,8,8: cả hai đều có lớp ngoài cùng 8 electron, bền như khí hiếm (Ne, Ar).',()=>{fin(3)})},1050)}
function trC(){if(!st.t4)fb('fb4','warn','🤔 Cl còn thiếu 1 electron để đủ 8 ở lớp ngoài, nó có xu hướng nhận hơn là nhường. Hãy thử nguyên tử còn lại.')}

/* ---------- Màn 5: hình thành ion ---------- */
const s4=()=>`<div class="card">${head('Hình thành ion','Nhiệm vụ: với mỗi nguyên tố, bấm "− 1 e" hoặc "+ 1 e" để đưa hạt về lớp ngoài cùng bền (8 e), rồi điền điện tích của hạt tạo thành.')}
<div class="row" style="align-items:flex-start"><div>${Object.keys(EL).map(k=>`<button class="btn g" id="b5${k}" onclick="sel5('${k}')">${k}</button>`).join(' ')}<svg id="sv5" viewBox="0 0 200 200" width="280"></svg>
<div class="row" style="justify-content:center"><button class="btn g" onclick="mv5(-1)">− 1 e (nhường)</button><button class="btn g" onclick="mv5(1)">+ 1 e (nhận)</button></div></div>
<div style="flex:1;min-width:260px"><table><tr><td>Số proton (p)</td><td id="p5"><b>–</b></td></tr><tr><td>Số electron (e)</td><td id="e5"><b>–</b></td></tr><tr><td>Cấu hình e</td><td id="c5"><b>–</b></td></tr>
<tr><td>Điện tích hạt = ?</td><td><select id="q5">${[-3,-2,-1,0,1,2,3].map(c=>`<option value="${c}"${c==0?' selected':''}>${c==0?'0 (trung hòa)':Math.abs(c)+(c>0?'+':'−')}</option>`).join('')}</select> <button class="btn" onclick="chk5()">Kiểm tra</button></td></tr></table>
<div class="fb info" id="m5">Chọn một nguyên tố để bắt đầu.</div></div></div><div id="c5x"></div></div>`;
function i4(){st.ok={}}
function sel5(k){st.k=k;st.e=EL[k].z;$$('[id^=b5]').forEach(b=>b.classList.remove('on'));$('#b5'+k).classList.add('on');dr5()}
function mv5(d){if(!st.k){fb('m5','warn','Hãy chọn nguyên tố trước.');return}const n=st.e+d;if(n<0||n>18){fb('m5','warn','Không thể thêm/bớt nữa trong mô hình này.');return}st.e=n;dr5()}
function dr5(){const z=EL[st.k].z,sh=fill(st.e);$('#sv5').innerHTML=atom(100,100,st.k,sh);$('#p5').innerHTML='<b>'+z+'</b>';$('#e5').innerHTML='<b>'+st.e+'</b>';$('#c5').innerHTML='<b>'+(sh.join(',')||'–')+'</b>';
 const stable=sh.length>1&&sh.at(-1)==8;fb('m5',stable?'ok':'info',stable?'✨ Lớp ngoài cùng có 8 electron: cấu hình bền như khí hiếm. Hãy điền điện tích của hạt này.':`Lớp ngoài cùng có ${sh.at(-1)||0} electron: chưa bền. Hãy tiếp tục chuyển electron.`)}
function chk5(){if(!st.k)return;const z=EL[st.k].z,real=z-st.e,v=+$('#q5').value,sh=fill(st.e),stable=sh.length>1&&sh.at(-1)==8;
